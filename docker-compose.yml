version: "3.8"

services:
  web:
    build:
      context: ./frontend
    ports:
      - 3000:3000
    networks:
      - frontend_backend_net
    depends_on:
      - db
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "5000"
    environment:
      - DB_HOST=db
      - DB_USERNAME=postgres
      - DB_PASSWORD=2001
      - DB_PORT=5432
      - DB_NAME=ecomm_db
    volumes:
      -  upload-data:/app/dist/uploads
    networks:
      - frontend_backend_net
      - backend_db_net
    
  db:
    image: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/src/db:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_PASSWORD=2001
      - POSTGRES_USER=postgres
      - POSTGRES_DB=ecomm_db
    networks:
      - backend_db_net
    ports:
      - "5432"

networks:
  frontend_backend_net:
  backend_db_net:

volumes:
  postgres-data:
  upload-data: