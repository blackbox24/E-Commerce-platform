version: "3.8"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - backend
    networks:
      - frontend_backend_net
    restart: always

  web:
    build:
      context: ./frontend
    # No public ports! Nginx handles this.
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api
    networks:
      - frontend_backend_net
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    restart: always

  backend:
    build:
      context: ./backend
    # No public ports! Nginx handles this.
    environment:
      - PORT=5000
      - DB_HOST=db
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-2001}
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-ecomm_db}
      - FRONTEND_URL=http://localhost
      - JWT_SECRET=${JWT_SECRET:-your_super_secret_jwt_key}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - NODE_ENV=production
    volumes:
      - upload-data:/app/dist/uploads
    networks:
      - frontend_backend_net
      - backend_db_net
    depends_on:
      db:
        condition: service_healthy
    restart: always
    
  db:
    image: postgres:15-alpine
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/src/db:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-2001}
      - POSTGRES_DB=${DB_NAME:-ecomm_db}
    networks:
      - backend_db_net
    ports:
      - "5432:5432" # Keep DB port for local management if needed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-ecomm_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

networks:
  frontend_backend_net:
  backend_db_net:

volumes:
  postgres-data:
  upload-data:
