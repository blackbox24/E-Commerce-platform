<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Page</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts CDN (Roboto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cookie.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cookie.js/1.2.3/cookie.min.js"></script>
    <!-- Axios CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="margin:0 padding:0">
    <!-- Navbar -->
    <nav class="bg-gray-800 p-4 text-white">
        <div class="container mx-auto flex justify-between items-center">
            <a href="home.html" class="font-bold text-xl">E-Commerce</a>
            <div>
                <a href="products.html" class="mx-2 hover:text-gray-300">Products</a>
                <a href="cart.html" class="mx-2 hover:text-gray-300">Cart</a>
                <a href="profile.html" class="mx-2 hover:text-gray-300">Profile</a>
                <a href="login.html" class="mx-2 hover:text-gray-300">Login</a>
                <a href="signup.html" class="mx-2 hover:text-gray-300">Signup</a>
            </div>
        </div>
    </nav>

    <!-- Cart Section -->
    <section class="container mx-auto py-12">
        <h2 class="text-3xl font-bold text-center mb-8">Your Shopping Cart</h2>
        <div class="bg-white shadow-lg rounded-lg overflow-hidden p-6">
            <!-- Cart Item 1 -->
            <div class="flex items-center justify-between border-b pb-4 mb-4">
                <div class="flex items-center">
                    <img src="https://via.placeholder.com/100" alt="Product Image" class="w-24 h-24 object-cover rounded-md mr-4">
                    <div>
                        <h3 class="font-bold text-lg">Product Name 1</h3>
                        <p class="text-gray-600">Quantity: 1</p>
                    </div>
                </div>
                <span class="font-bold text-lg">$29.99</span>
            </div>
            <!-- Cart Item 2 -->
            <div class="flex items-center justify-between border-b pb-4 mb-4">
                <div class="flex items-center">
                    <img src="https://via.placeholder.com/100" alt="Product Image" class="w-24 h-24 object-cover rounded-md mr-4">
                    <div>
                        <h3 class="font-bold text-lg">Product Name 2</h3>
                        <p class="text-gray-600">Quantity: 2</p>
                    </div>
                </div>
                <span class="font-bold text-lg">$79.98</span>
            </div>

            <div class="flex justify-end items-center mt-6">
                <span class="font-bold text-2xl mr-4">Subtotal: $109.97</span>
                <a href="checkout.html" class="bg-green-600 text-white px-6 py-3 rounded-full font-semibold hover:bg-green-700">Proceed to Checkout</a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-8 mt-12">
        <div class="container mx-auto text-center">
            <p>&copy; 2024 E-Commerce. All rights reserved.</p>
        </div>
    </footer>
    <script type="module" src="api.js"></script>
    <script type="module" src="auth_guard.js"></script>
    <!-- jQuery CDN -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
