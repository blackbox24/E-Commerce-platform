<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Page</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts CDN (Roboto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <!-- Cookie.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cookie.js/1.2.3/cookie.min.js"></script>
    <!-- Axios CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="margin:0 padding:0">
    <!-- Navbar -->
    <nav class="bg-gray-800 p-4 text-white">
        <div class="container mx-auto flex justify-between items-center">
            <a href="home.html" class="font-bold text-xl">E-Commerce</a>
            <div>
                <a href="products.html" class="mx-2 hover:text-gray-300">Products</a>
                <a href="cart.html" class="mx-2 hover:text-gray-300">Cart</a>
                <a href="profile.html" class="mx-2 hover:text-gray-300">Profile</a>
                <a href="login.html" class="mx-2 hover:text-gray-300">Login</a>
                <a href="signup.html" class="mx-2 hover:text-gray-300">Signup</a>
            </div>
        </div>
    </nav>

    <!-- Dashboard Section -->
    <section class="container mx-auto py-12">
        <h2 class="text-3xl font-bold text-center mb-8">Admin Dashboard</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Card 1: Total Sales -->
            <div class="bg-white shadow-lg rounded-lg p-6 text-center">
                <h3 class="text-xl font-bold mb-2">Total Sales</h3>
                <p class="text-4xl text-green-600 font-bold">$12,345</p>
            </div>
            <!-- Card 2: New Orders -->
            <div class="bg-white shadow-lg rounded-lg p-6 text-center">
                <h3 class="text-xl font-bold mb-2">New Orders</h3>
                <p class="text-4xl text-blue-600 font-bold">50</p>
            </div>
            <!-- Card 3: New Users -->
            <div class="bg-white shadow-lg rounded-lg p-6 text-center">
                <h3 class="text-xl font-bold mb-2">New Users</h3>
                <p class="text-4xl text-purple-600 font-bold">120</p>
            </div>
        </div>

        <div class="mt-12">
            <h3 class="text-2xl font-bold mb-6">Quick Actions</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <a href="add_product.html" class="bg-blue-500 text-white px-6 py-4 rounded-lg text-center font-semibold hover:bg-blue-600">Add Product</a>
                <a href="view_users.html" class="bg-green-500 text-white px-6 py-4 rounded-lg text-center font-semibold hover:bg-green-600">View Users</a>
                <a href="view_orders.html" class="bg-purple-500 text-white px-6 py-4 rounded-lg text-center font-semibold hover:bg-purple-600">View Orders</a>
                <a href="admin_settings.html" class="bg-gray-500 text-white px-6 py-4 rounded-lg text-center font-semibold hover:bg-gray-600">Admin Settings</a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-8 mt-12">
        <div class="container mx-auto text-center">
            <p>&copy; 2024 E-Commerce. All rights reserved.</p>
        </div>
    </footer>
    <script type="module" src="api.js"></script>
    <!-- jQuery CDN -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
